[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
addopts =
    # Verbosity
    -v
    --tb=short

    # Coverage options
    --cov=CITEgeist/model
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --cov-fail-under=6

    # Show local variables in tracebacks
    --showlocals

    # Strict markers
    --strict-markers

    # Disable warnings summary for cleaner output
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for full workflows
    slow: Tests that take a long time to run
    requires_gurobi: Tests that require Gurobi license
    requires_data: Tests that require actual data files
    requires_cuopt: Tests that require cuOPT (GPU node only)

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 3.10

# Ignore paths
norecursedirs = .git .tox dist build *.egg htmlcov Benchmarking examples tests/_archive _archive

# Coverage options
[coverage:run]
source = CITEgeist/model
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */_archive/*
    */dead/*

[coverage:html]
directory = htmlcov

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
