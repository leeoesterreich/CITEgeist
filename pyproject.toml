[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citegeist"
version = "0.2.0"
description = "CITEgeist 0.2.0: v1 proportions (Gurobi QP) and SACE per-cell expression allocation in one install, for reproducing the ERT paper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Alexander Chih-Chieh Chang"},
    {name = "Brent T. Schlegel"},
    {name = "Lee/Oesterreich Laboratory"},
]
keywords = ["spatial-transcriptomics", "CITE-seq", "deconvolution", "computational-biology", "single-cell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Union of the 0.1.1 (v1 proportions) and 2.0.0 (SACE) requirements. psutil and statsmodels are
# imported unconditionally by citegeist.core.gurobi_impl (0.1.1 left them undeclared).
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scanpy>=1.9.0",
    "squidpy>=1.6.2",
    "anndata>=0.8.0",
    "pyarrow>=5.0.0",
    "gurobipy>=9.5.0",
    "scikit-learn>=1.0.0",
    "scikit-image>=0.22.0",
    "matplotlib>=3.5.0",
    "statsmodels>=0.13.0",
    "psutil>=5.9.0",
    "networkx",
    "tqdm>=4.62.0",
    "joblib",
    "esda",
    "libpysal",
]

[project.optional-dependencies]
imaging = ["stardist"]
dev = ["pytest>=7.0", "black>=22.0", "isort>=5.10"]

[project.urls]
Homepage = "https://github.com/leeoesterreich/CITEgeist"
Repository = "https://github.com/leeoesterreich/CITEgeist"
"Bug Tracker" = "https://github.com/leeoesterreich/CITEgeist/issues"

[tool.setuptools.packages.find]
include = ["citegeist*"]

[tool.setuptools.package-data]
citegeist = ["py.typed"]
