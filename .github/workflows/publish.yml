name: Publish to PyPI

# Publishes the built sdist + wheel to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo.
# ONE-TIME SETUP (maintainer, on pypi.org): add this repo as a Trusted Publisher
# for the `citegeist` project (Publisher: GitHub Actions, workflow: publish.yml,
# environment: pypi). Until that is configured, this workflow will fail at the
# upload step — building still succeeds.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
