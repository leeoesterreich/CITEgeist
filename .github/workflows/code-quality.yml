name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy

    - name: Check code formatting with black
      run: |
        black --check --line-length=120 CITEgeist/ --exclude="Benchmarking/"
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black --line-length 120 CITEgeist/ --skip Benchmarking
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 CITEgeist/ --max-line-length=120 --extend-ignore=E203,E501,W503,E402 --exclude=Benchmarking/* --count --show-source --statistics
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy CITEgeist/ --ignore-missing-imports --no-strict-optional --exclude Benchmarking
      continue-on-error: true

    - name: Summary
      if: always()
      run: |
        echo "Code quality checks completed. Review the logs above for any issues."
        echo "Note: These checks are informational and won't fail the build."
