name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache conda environment
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('CITEgeist_env.yml') }}

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,bioconda,defaults
        channel-priority: flexible

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda env update --file CITEgeist_env.yml --name base
        pip install pytest pytest-cov

    - name: Run tests
      shell: bash -l {0}
      run: |
        # Run tests if test files exist
        if [ -d "CITEgeist/tests" ] && [ "$(ls -A CITEgeist/tests/test_*.py 2>/dev/null)" ]; then
          pytest CITEgeist/tests/ -v --cov=CITEgeist --cov-report=xml --cov-report=term-missing
        else
          echo "No test files found, skipping tests"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.10'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
