name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black==23.12.1 isort==5.13.2

      - name: Check formatting with black
        run: black --check --line-length=120 CITEgeist/ --exclude="Benchmarking/"

      - name: Check import sorting with isort
        run: isort --check-only --profile black --line-length 120 CITEgeist/ --skip Benchmarking

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0

      - name: Lint with flake8
        run: flake8 CITEgeist/ --max-line-length=120 --extend-ignore=E203,E501,W503,E402 --exclude=Benchmarking/ --count --statistics

  test:
    runs-on: ubuntu-latest
    needs: [format-check, lint]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          # pytest imports every collected module before marker filtering, so a
          # module-scope import of a package outside the dependency closure
          # aborts the run with RC 2. tests/ci_collect_skip.txt lists any such
          # paths; it is optional, and paths in it that do not exist are
          # skipped, so this works unchanged on a tree that has none of them.
          IGNORES=""
          if [ -f tests/ci_collect_skip.txt ]; then
            while read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              [ -e "$line" ] && IGNORES="$IGNORES --ignore=$line"
            done < tests/ci_collect_skip.txt
          fi
          echo "collection ignores:${IGNORES:- (none)}"
          pytest tests/ \
            -m "unit and not slow and not requires_data and not requires_cuopt" \
            $IGNORES \
            --cov=CITEgeist/model \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=15 \
            --tb=short \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
