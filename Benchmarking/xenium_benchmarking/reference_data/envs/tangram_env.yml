name: tangram_env
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pytorch>=2.0
  - pytorch-cuda=11.8
  - scanpy>=1.9
  - anndata>=0.9
  - numpy<2.0
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - h5py
  - leidenalg
  - pip
  - pip:
    - tangram-sc>=1.0.4
    - harmonypy
