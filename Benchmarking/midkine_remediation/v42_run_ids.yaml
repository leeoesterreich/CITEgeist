# min_code_commit (top-level, set by the commit that holds the v2 producers) bounds the code_commit of every stamp from below.
# Stages (scope map 1C): B1 breast proportions, B2 nuclei, B3 Hungarian rebuild, B4 SACE layers, B5 compartments,
# B6 COMMOT, B7 positive control, B8 hurdle, B9 Moran's I (+B13 trajectory), B10 NMF/Module 4, B11 program recovery,
# B12 keratin-secretory, B19-B23 promoted post-hoc checks (ORA Test B, ORA on SACE layers, keratin/E2, Moran's I robustness, keratin-secretory covariate absorption), B17 matched gene controls for Moran's I (promoted from exploratory check 2), B18 MDK-NCL sender/receiver cell-type map
# (promoted from exploratory check 3; descriptive only); X1 official proportions, X2 strict scoring, X3 SACE no_round, X4 fair GEX, X5 RMSE/sigma,
# X6 single-cell, X7 protein-input sensitivity, X8 settings/robustness, X9 reused GT/competitors/simulation, X10 withheld-gene cross-fit,
# X11 leave-one-region-out tuning audit of frozen v2 (recomputed from frozen-v2 inputs; gated against the stored r8 row),
# X12 EM convergence check of the default refinement (cap 150 vs run to convergence; stamped convergence.json),
# X51 first rerun of X5 (sample std, ddof=1; evaluation/rnaprot_v2_fair_x5_ddof1; X5 v2x5 stays registered until the manifest is repointed),
# B221 first rerun of B22 (the same six Moran robustness checks plus check 17, the D5 covariate without self-inclusion / shared denominator; B22 v2b22 stays registered and is no longer read once the manifest is repointed),
# B24 coverage of the nominal GMR interval under the RNA-total covariate (prod_coverage.py; a stamped input of B8),
# B25 Modules 4/4b/5 on the v42 SACE layers, Module 5 grouping within cell type (run_module45.py --stamp; the per-specimen outputs, module5.pkl and mdk_readout.json).
# B26 all-pair COMMOT survey at level 1 (B5 compartments, stage B6 R00 setting, every sender/receiver column) and level 2 (raw Visium spots) plus the check 19 ranking of cancer-sent pathways (commot_survey_v42/commot_survey.py; descriptive; v2b26 is the id of B26, not a rerun of B2).
# RNA-total covariate fix (protocol deviation 2026-11-06, docs/superpowers/plans/2026-11-06-rna-total-covariate-fix.md): B7, B8, B12, B18, B21, B23 are rerun in place with rna="total"
# (v2b7 -> v2b71, v2b8 -> v2b81, v2b18 -> v2b181, v2b121 -> v2b122, v2b21 -> v2b211, v2b23 -> v2b231); B221 and B24 are new. v2b22 stays registered (B22) until the manifest is repointed to B221.
# A run id must match ^v2[bx]\d+$ and be unique. NOT_RUN is allowed but makes any consumer raise.
# GENERATION RECORD (one place; chain_preflight and submit-v2-breast-chain.sh read it):
#  - current_v2_ts: the ONLY V2_TS (names output/module3_rna_refined_7type_<ts> and output/nuclei_rebuilt_7type_<ts>) the chain accepts.
#  - superseded: the first v2 attempt (V2_TS 20261102T083417Z; B2 counts-only; B3 re-segmented in the job and differed from B2 by up to 3 per spot
#    in all 12 specimens) and the B3/B4/B5 runs built from it. Their folders stay on disk untouched and are refused as inputs.
#  - B3/B4/B5 have NEW ids because v2b3/v2b4/v2b5 exist on disk; B1/B2 keep v2b1/v2b2 (the frozen protocol text names them) under the new TS.
#  - B9/B12 (v2b9, v2b12) are superseded by v2b91/v2b121: SpectralNull's eigenbasis in tied eigenspaces depended on the BLAS thread count
#    (morans.canonical_eigh fixes it); the v2b9/v2b12 p-values are not reproducible across thread counts and must not be consumed.
#  - B17 (v2b17) is superseded by v2b171: its gate name said 'vs v2b9 per_specimen' although the reference was v2b91. Stale label only, values unchanged.
#  - B25 (v2b25) is superseded by v2b251: the serial 12 h job was cancelled and replaced by an array job (per-specimen tasks + finalize); the partial v2b25 dir is never read.
#  - B19/B20 (v2b19, v2b20) are superseded by v2b191/v2b201: their Xenium tasks looked for untracked data inside the clean worktree and failed, so neither stage was stamped.
# New ids follow <stage id>1 = first rerun (digits only: the run-name rule is ^v2[bx]\d+$).
