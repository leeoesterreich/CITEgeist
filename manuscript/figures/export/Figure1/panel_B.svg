<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .subtitle { font-family: Arial, sans-serif; font-size: 11px; }
      .label { font-family: Arial, sans-serif; font-size: 10px; }
      .small { font-family: Arial, sans-serif; font-size: 9px; }
      .italic { font-style: italic; }
      .bold { font-weight: bold; }
      .white { fill: white; }
      .neutral { fill: #7f8c8d; }
    </style>
  </defs>
  <text x="200" y="25" class="title" text-anchor="middle">Spatial Statistics Foundation</text>
  <text x="70" y="55" class="label bold" text-anchor="middle">Moran's I</text>
  <text x="70" y="90" class="small" text-anchor="middle">I = Σᵢⱼ wᵢⱼ(xᵢ-x̄)(xⱼ-x̄)</text>
  <text x="70" y="110" class="small" text-anchor="middle">      / Σᵢ(xᵢ-x̄)²</text>
  <text x="70" y="145" class="small italic neutral" text-anchor="middle">Spatial autocorrelation</text>
  <text x="70" y="160" class="small italic neutral" text-anchor="middle">(marker clustering)</text>
  <text x="200" y="55" class="label bold" text-anchor="middle">Colocalization</text>
  <circle cx="180" cy="100" r="30" fill="#3498db" stroke="none" stroke-width="0"/>
  <circle cx="180" cy="100" r="30" fill="#3498db" opacity="0.5"/>
  <circle cx="220" cy="100" r="30" fill="#e91e63" opacity="0.5"/>
  <text x="170" y="105" class="small bold" text-anchor="middle">M1</text>
  <text x="230" y="105" class="small bold" text-anchor="middle">M2</text>
  <text x="200" y="145" class="small italic neutral" text-anchor="middle">Bivariate Moran's I</text>
  <text x="200" y="160" class="small italic neutral" text-anchor="middle">Co-occurrence scoring</text>
  <text x="330" y="55" class="label bold" text-anchor="middle">Spatial Graph</text>
  <circle cx="310" cy="90" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <circle cx="350" cy="90" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <circle cx="330" cy="120" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <circle cx="310" cy="120" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <circle cx="350" cy="120" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <circle cx="330" cy="90" r="10" fill="#9b59b6" stroke="none" stroke-width="1"/>
  <line x1="310" y1="90" x2="350" y2="90" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="90" x2="330" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="90" x2="330" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="120" x2="330" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="120" x2="330" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="90" x2="310" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="90" x2="350" y2="120" stroke="#2c3e50" stroke-width="1" opacity="0.5"/>
  <text x="330" y="155" class="small italic neutral" text-anchor="middle">k-NN / Radius</text>
  <text x="330" y="170" class="small italic neutral" text-anchor="middle">Neighbor weighting</text>
  <rect x="50" y="220" width="300" height="50" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5" opacity="1"/>
  <text x="200" y="245" class="small italic neutral" text-anchor="middle">All modules leverage spatial context through</text>
  <text x="200" y="262" class="small italic neutral" text-anchor="middle">neighbor-weighted statistics</text>
</svg>
