version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

sphinx:
  configuration: docs/source/conf.py

# Docs build only. requirements-dev.txt pulls torch, opencv and the full test
# stack and exceeds RTD's build resources; the package itself is not installed
# either. docs/source/conf.py puts the repository on sys.path and mocks the
# heavy/GPU imports (see autodoc_mock_imports there).
python:
  install:
    - requirements: docs/requirements.txt
